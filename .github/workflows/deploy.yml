name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo lo imprescindible para compilar y publicar. El token no puede escribir
# en el repositorio: si una dependencia comprometida intentase colar un commit
# durante el build, no tendria con que.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Las acciones van fijadas al SHA del commit, no a la etiqueta: una
      # etiqueta como v7 se puede reapuntar a otro codigo sin que cambie el
      # nombre. Dependabot las actualiza y deja el numero de version al lado.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Auditoria de dependencias
        run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Servir también rutas desconocidas desde index.html
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
