name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: este workflow compila y prueba, no publica ni escribe nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Mismas acciones y SHA que deploy.yml (Dependabot las mantiene).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoria de dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
